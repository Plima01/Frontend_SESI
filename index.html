<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore SESI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    <h1> TechStore </h1>

    <section class="formulario">
        <h1> Dados de Venda </h1>
        <input type= "text" id="inputNome" placeholder="nome do clinte">
        <input type="number" id="inputIdade" placeholder=" idade do cliente">
        <input type="number" id="inputValor" placeholder="valor total:">
        <select id="inputCupom">
        <option value="false"> Voce nao possui cupom </option>    
        <option value="true"> Voce possui cupom (15% OFF) </option>

        </select>
        <button onclick="executarSistema()"> Finalizar venda</button>
    </section>

    <hr>

    <section id="feedback">
        <p id="mensagem-autorizacao">Preencha os dados a cima</p>
        <ul id="lista-estoque"></ul>
        <div id="relatorio-final"class="card" style="display: none;">

        </div>

    </section>

   </div>
    <script src="script.js"></script>

</body>
</html>
